.perks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,112px),1fr));gap:10px;padding:14px}
.perk{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 6px 12px;border-radius:var(--r-m);background:var(--surface2);border:1px solid var(--line);min-width:0}

.perk .ph{width:30px;height:30px;border:1.6px dashed var(--fg3);border-radius:4px;transform:rotate(45deg)}
.perk b{font-size:13px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.perk small{font-size:11.5px;color:var(--fg3);font-weight:600}
.foot{color:var(--fg3);font-size:12.5px;margin:22px 6px 0;max-width:70ch}

/* Exotics + guide */
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 16px;margin-bottom:16px;color:var(--fg2);font-size:14px}
.banner svg{width:20px;height:20px;flex:none;color:var(--warn);margin-top:1px}
.lst{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;margin-bottom:18px}
.lrow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px}
.lrow+.lrow{border-top:1px solid var(--line)}
.lrow .d{width:10px;height:10px;border-radius:50%;background:var(--kinetic)}
.lrow b{font-weight:600;font-size:16px;display:block}
.lrow small{color:var(--fg2);font-size:13px}
.guide p{margin:0 0 10px;color:var(--fg2);font-size:15px}
.steps{margin:0;padding:0;list-style:none;display:grid}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:14px 16px}
.steps li+li{border-top:1px solid var(--line)}
.steps .n{width:28px;height:28px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.steps b{display:block;font-weight:650}
.steps span{color:var(--fg2);font-size:14px}
.rules{margin:0;padding:6px 16px 6px 34px;color:var(--fg);font-size:15px}
.rules li{padding:8px 0}
.meter{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--tint);border-radius:99px;transition:width .6s var(--spring)}
.cov{padding:14px 16px}
.cov+.cov{border-top:1px solid var(--line)}
.cov .h{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.cov .h span{color:var(--fg2);font-weight:500;font-size:14px}

.empty{text-align:center;padding:56px 24px;color:var(--fg2)}
.empty h3{margin:0 0 6px;font-size:21px;color:var(--fg);letter-spacing:-.015em}
.empty p{margin:0 auto;max-width:36ch}
.skel{height:92px;border-radius:var(--r-l);background:var(--fill)}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;animation:enter .35s var(--spring)}

/* Learn */
.learn{max-width:760px}
.seg.scroll{overflow-x:auto;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
.litem{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:15px 16px}
.litem.plain{grid-template-columns:minmax(0,1fr)}
.litem+.litem{border-top:1px solid var(--line)}
.litem .n{width:30px;height:30px;border-radius:50%;background:var(--tint);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.litem b{display:block;font-weight:650;font-size:16.5px;margin-bottom:3px}
.litem p{margin:0;color:var(--fg2);font-size:14.5px;line-height:1.55}
.lintro{color:var(--fg2);font-size:15px;margin:0 6px 14px;max-width:64ch}
.llink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;color:var(--fg);text-decoration:none}
.llink+.llink{border-top:1px solid var(--line)}
.llink:hover{background:var(--fill)}
.llink small{display:block;color:var(--fg2);font-size:13px}
.llink svg{width:18px;height:18px;color:var(--fg3);flex:none}
.llink:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* Ratings */
.rate-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.radar-wrap{display:grid;place-items:center;padding:14px 8px 4px}
.radar{width:100%;max-width:340px;height:auto;overflow:visible}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar text{fill:var(--fg2);font-size:10.5px;font-weight:600;font-family:var(--f-ui)}
.radar .s{stroke-width:2;stroke-linejoin:round}
.bars{padding:6px 16px 14px;display:grid;gap:11px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.bar .v{font-family:var(--f-mono);font-weight:600;font-size:14px}
.bar .m{grid-column:1/-1;height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar .m i{display:block;height:100%;border-radius:99px;background:var(--accent,var(--tint));transition:width .6s var(--spring)}
.bar .m i.b{background:var(--solar)}
.cmp{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 14px 0}
.cmp select{padding-left:20px!important;flex:1 1 200px!important;height:38px;border-radius:999px;border:0;background:var(--fill);color:var(--fg);font:inherit;font-size:14px;font-weight:600;padding:0 14px;max-width:100%;min-width:0;flex:1 1 150px}
.cmp select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--fg2)}
.key i{width:10px;height:10px;border-radius:50%}
.rank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.rrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.rrow+.rrow{border-top:1px solid var(--line)}
.rrow .glyph{width:40px;height:40px;border-radius:12px}
.rrow .glyph svg{width:22px;height:22px}
.rrow b{font-weight:650;display:block}
.rrow .m{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:6px}
.rrow .m i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.rrow .v{font-family:var(--f-mono);font-weight:700;font-size:20px}
.tag.role{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:no-preference){.skel{animation:shimmer 1.4s ease-in-out infinite}}
.toast{transform:translateX(-50%)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast{animation:toastin .35s var(--spring)}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

@media (max-width:520px){
  .stats{grid-template-columns:minmax(0,1fr)}
  .grow{grid-template-columns:minmax(0,1fr);gap:4px}
  .stat .t{font-size:24px}
}

  body{padding-left:max(16px,env(safe-area-inset-left,0px))}

  .dock-brand{display:block;font-size:19px;font-weight:750;letter-spacing:-.02em;padding:0 12px;line-height:1.15}

  .stage{max-width:1120px;margin:0 auto 0 240px;padding-block:calc(22px + env(safe-area-inset-top,0px)) 56px}
  .toast{bottom:28px;left:calc(50% + 120px)}
  .split{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:28px;align-items:start}
  .build-list{grid-template-columns:minmax(0,1fr);position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px)}
  .pick .chev{display:none}
  .pick{grid-template-columns:auto minmax(0,1fr)}
  .detail{position:static;inset:auto;transform:none;visibility:visible;background:none;overflow:visible;transition:none;min-width:0;z-index:auto}
  .detail::before{display:none}
  .detail-in{max-width:none;padding:0}
  .dbar{top:calc(env(safe-area-inset-top,0px) + 8px);padding:0 0 12px;margin:0}
  .dbar .back{display:none}
  .dbar .ttl{text-align:left;padding-left:10px}
  .dbar .glassbar{border-radius:var(--r-l);padding:6px 6px 6px 8px}
  .hero{padding-top:6px}
  .pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
  .pair .section{margin-top:26px}
  .rate-grid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
}

/* ---------- Intro ---------- */
.intro{position:fixed;inset:0;z-index:1000;background:#04060B;color:#fff;overflow:hidden;display:grid;place-items:center;opacity:1;transition:opacity .9s ease}
.intro[hidden]{display:none}
.intro.out{opacity:0;pointer-events:none;transition:opacity 1.4s cubic-bezier(.4,0,.2,1) .15s}
.intro.go.out .i-word{animation:iWordOut 1.5s cubic-bezier(.4,0,.2,1) forwards}
.intro.out .i-glow{transition:opacity 1.2s ease;opacity:0!important}
.intro canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.i-glow{position:absolute;left:50%;top:50%;width:140vmax;height:140vmax;transform:translate(-50%,-50%);background:radial-gradient(circle closest-side,rgba(121,187,231,.22),rgba(163,113,194,.10) 38%,rgba(4,6,11,0) 70%);opacity:.35}
.intro.go .i-glow{animation:iGlow 7s ease-out forwards}
.i-line{position:absolute;left:50%;top:50%;width:min(92vw,900px);height:1px;transform:translate(-50%,-50%) scaleX(0);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);opacity:.6;transform:translate(-50%,-50%) scaleX(1)}
.intro.go .i-line{animation:iLineOut .8s ease 4.3s forwards}
.i-orbit{position:absolute;left:50%;top:50%;width:0;height:0;--r:min(31vw,150px);--s:clamp(44px,12vmin,66px)}
.i-ico{position:absolute;left:calc(var(--s)/-2);top:calc(var(--s)/-2);width:var(--s);height:var(--s);padding:0;border:0;background:none;color:inherit;font:inherit;cursor:pointer;opacity:1;transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1));will-change:transform,opacity;transition:opacity .6s ease}
.i-ico::after{content:"";position:absolute;inset:-14px;border-radius:50%}
.i-ico img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 0 10px var(--c)) drop-shadow(0 0 22px var(--c));transition:filter .3s ease,transform .3s ease;animation:iBob 4.2s ease-in-out calc(var(--i)*-.7s) infinite}
.i-ico:hover img,.i-ico:focus-visible img{filter:drop-shadow(0 0 14px var(--c)) drop-shadow(0 0 34px var(--c)) brightness(1.25)}
.i-ico:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:50%}
.i-ico .lbl{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);font-size:11px;letter-spacing:.22em;padding-left:.22em;font-weight:600;color:rgba(255,255,255,.62);white-space:nowrap;transition:opacity .5s ease}
.i-ico.fav .lbl{color:#fff}
.i-ico.fav::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid var(--c);opacity:.7}
.intro.go .i-ico{cursor:default;pointer-events:none}
.intro.go .i-ico .lbl{opacity:0}
.intro.go .i-ico{animation:iPing .75s ease calc(.9s + var(--i)*.45s),iConv .75s cubic-bezier(.55,0,.85,.35) 3.75s forwards}
.intro.go .i-ico.pick{animation:iPick .9s cubic-bezier(.2,.7,.2,1) forwards,iPing .75s ease calc(.9s + var(--i)*.45s),iConv .75s cubic-bezier(.55,0,.85,.35) 3.75s forwards}
.intro.go.has-pick .i-ico:not(.pick){opacity:.55}
.intro.go .i-ico.pick img{filter:drop-shadow(0 0 16px var(--c)) drop-shadow(0 0 40px var(--c)) brightness(1.2)}
.intro canvas,.i-glow,.i-line,.i-core,.i-pulse,.i-flash,.i-word,.i-prompt{pointer-events:none}
.i-prompt{position:absolute;left:0;right:0;top:calc(50% - min(31vw,150px) - 118px);text-align:center;font-size:clamp(11px,3.1vw,14px);letter-spacing:.5em;padding-left:.5em;font-weight:600;color:rgba(255,255,255,.82);transition:opacity .5s ease;margin:0}
.i-prompt small{display:block;margin-top:10px;letter-spacing:.08em;font-weight:500;color:rgba(255,255,255,.45);font-size:12px}
.i-nofav{white-space:nowrap;position:absolute;left:50%;bottom:calc(11vh + env(safe-area-inset-bottom));transform:translateX(-50%);background:none;border:0;color:rgba(255,255,255,.55);font:inherit;font-size:14px;letter-spacing:.06em;padding:12px 18px;border-radius:999px;cursor:pointer;transition:opacity .5s ease,color .2s ease}
.i-nofav:hover,.i-nofav:focus-visible{color:#fff}
.i-nofav:focus-visible{outline:2px solid #fff;outline-offset:2px}
.intro.go .i-prompt,.intro.go .i-nofav{opacity:0;pointer-events:none}
.i-core{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 40px 18px rgba(255,255,255,.55)}
.intro.go .i-core{animation:iCore 1.6s ease 3.9s forwards}
.i-pulse{position:absolute;left:50%;top:50%;width:min(40vmin,300px);height:min(40vmin,300px);margin:calc(min(40vmin,300px)/-2) 0 0 calc(min(40vmin,300px)/-2);border-radius:50%;border:1px solid rgba(255,255,255,.8);opacity:0;transform:scale(.1)}
.intro.go .i-pulse{animation:iPulse 1.8s cubic-bezier(.1,.6,.2,1) 4.5s forwards}
.i-flash{position:absolute;inset:0;background:radial-gradient(circle closest-side at 50% 50%,#fff,rgba(255,255,255,.6) 30%,rgba(255,255,255,0) 70%);opacity:0}
.intro.go .i-flash{animation:iFlash 1.1s ease-out 4.5s forwards}
.i-word{position:relative;text-align:center;opacity:0;padding:0 16px}
.i-word h2{margin:0;font-size:clamp(34px,10.5vw,84px);font-weight:700;letter-spacing:.34em;padding-left:.34em;line-height:1;text-shadow:0 0 30px rgba(255,255,255,.35)}
.i-word p{margin:14px 0 0;display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(11px,2.9vw,17px);font-weight:600;letter-spacing:.4em;padding-left:.4em;color:var(--exo,#F2C94C)}
.i-word p::before,.i-word p::after{content:"";height:1px;width:clamp(16px,7vw,60px);background:linear-gradient(90deg,transparent,currentColor)}
.i-word p::after{transform:scaleX(-1)}
.intro.go .i-word{animation:iWord 1.7s cubic-bezier(.2,.7,.2,1) 4.5s forwards}
.intro.go .dock-brand{cursor:pointer}
@keyframes iGlow{0%{opacity:.35}35%{opacity:.8}100%{opacity:.35}}
@keyframes iBob{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
@keyframes iPing{0%{transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1)}40%{transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1.35)}100%{transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1)}}
@keyframes iPick{0%{transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1)}35%{transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1.6)}100%{transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1.12)}}
@keyframes iLine{0%{opacity:0;transform:translate(-50%,-50%) scaleX(0)}30%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}}
@keyframes iLineOut{to{opacity:0}}
@keyframes iIn{from{opacity:0;filter:blur(8px);transform:rotate(var(--a)) translateY(calc(var(--r)*-1.3)) rotate(calc(var(--a)*-1)) scale(.55)}to{opacity:1;filter:blur(0);transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1)}}
@keyframes iConv{from{opacity:1;transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1)) scale(1)}to{opacity:0;transform:rotate(var(--a)) translateY(0) rotate(calc(var(--a)*-1)) scale(.2)}}
@keyframes iCore{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(1.6)}100%{opacity:0;transform:scale(5)}}
@keyframes iPulse{0%{opacity:.9;transform:scale(.1)}100%{opacity:0;transform:scale(3.4)}}
@keyframes iFlash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
@keyframes iWord{0%{opacity:0;filter:blur(14px);transform:scale(1.08)}100%{opacity:1;filter:blur(0);transform:scale(1)}}
@keyframes favIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.dtab{appearance:none;border:0;background:transparent;color:var(--fg2);font:inherit;font-size:13.5px;font-weight:600;padding:10px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px}
.dtab[aria-selected="true"]{background:var(--fill2);color:var(--fg)}
.dtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:520px){.dpill{width:100%}.dtab{flex:1 1 auto;padding:10px 6px;font-size:12.5px}}
.credit .av.pic{background:none;padding:0;overflow:hidden}.credit .av img{width:100%;height:100%;object-fit:cover;display:block}
.credit .vt{flex-basis:100%;margin:0;font-size:13px;color:var(--fg2);line-height:1.35}
.credit .cl{display:flex;gap:8px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;text-decoration:none;font-weight:600;font-size:13px;padding:9px 14px;border-radius:999px;background:var(--fill2);color:var(--fg)}
.cbtn.p{background:var(--accent);color:#0b0d12}
.detail[data-el=stasis] .cbtn.p,.detail[data-el=void] .cbtn.p,.detail[data-el=prismatic] .cbtn.p,.detail[data-el=stasis] .credit .av,.detail[data-el=void] .credit .av,.detail[data-el=prismatic] .credit .av{color:#fff}
.cbtn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
@keyframes iWordOut{0%{opacity:1;filter:blur(0);transform:scale(1)}100%{opacity:0;filter:blur(12px);transform:scale(1.22)}}
@keyframes stageIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes dockIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.app.enter .dock-items,.app.enter .dock-brand{animation:dockIn 1s cubic-bezier(.2,.7,.2,1) .45s backwards}
@media (prefers-reduced-motion:reduce){.intro{display:none!important}.app.enter .dock-items,.app.enter .dock-brand{animation:none}}
</style>
